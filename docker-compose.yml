services:
  # ==========================================
  # 1. NestJS Enterprise Backend API
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: mis-backend:latest
    container_name: rayee_meal_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=meal_admin
      - DATABASE_PASSWORD=MealSecure@2026
      - DATABASE_NAME=rayee_meal_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  # ==========================================
  # 2. React + Tailwind Frontend (Nginx)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mis-frontend:latest
    container_name: rayee_meal_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend

  # ==========================================
  # 3. PostgreSQL Database with Seed Data
  # ==========================================
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: mis-postgres:latest
    container_name: rayee_meal_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=meal_admin
      - POSTGRES_PASSWORD=MealSecure@2026
      - POSTGRES_DB=rayee_meal_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ==========================================
  # 4. Redis Caching & Session Store
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: rayee_meal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
